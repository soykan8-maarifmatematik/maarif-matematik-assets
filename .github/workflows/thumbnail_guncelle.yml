name: Maarif Matematik — Thumbnail Güncelle

on:
  push:
    paths:
      - 'thumbnail_update.json'
      - 'thumbnail.png'
  workflow_dispatch:

concurrency:
  group: maarif-thumbnail
  cancel-in-progress: true

jobs:
  guncelle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklar
        run: |
          pip install \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Thumbnail Yukle
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python scripts/thumbnail_guncelle.py
