name: Maarif Matematik Video Render

on:
  push:
    paths:
      - 'scripts/render_code.py'
      - 'audio/ders_sesi.mp3'
  workflow_dispatch: # Manuel başlatma butonu ekler

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev mesa-utils libpng-dev libjpeg-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render Manim Video
        run: |
          # Gemini'nin yazdığı render_code.py dosyasını çalıştırır
          # Manim komutu genellikle python -m manim ... şeklindedir
          # Eğer kodun içinde Manim komutu gömülü değilse burayı özelleştirebiliriz
          python scripts/render_code.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maarif-matematik-video
          path: media/videos/render_code/1080p60/*.mp4 # Manim varsayılan çıktı yolu
          if-no-files-found: warn

      - name: Process and Upload to YouTube (Optional)
        # Eğer Server.py hazırsa buraya eklenebilir
        run: |
          # python scripts/server.py
          echo "Video başarıyla üretildi. YouTube yükleme aşamasına geçilebilir."
