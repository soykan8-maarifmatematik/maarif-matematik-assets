name: Maarif Matematik Video Render

on:
  push:
    paths:
      - 'scripts/render_code.py'
      - 'audio/ders_sesi.mp3'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev mesa-utils libpng-dev libjpeg-dev

      - name: Install Manim and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim numpy

      - name: Create Required Directories
        run: |
          mkdir -p media/videos
          mkdir -p scripts
          mkdir -p audio

      - name: Check Files
        run: |
          echo "Mevcut dosyalar kontrol ediliyor..."
          ls -R scripts/
          ls -R audio/

      - name: Render Manim Video
        run: |
          # Render komutunu daha detaylı çıktı verecek şekilde güncelledik
          manim -qm --progress_bar display scripts/render_code.py --all

      - name: Upload Video Artifact
        if: always() # Hata alsa bile klasörleri yükle ki ne olduğunu görelim
        uses: actions/upload-artifact@v4
        with:
          name: maarif-matematik-video
          path: |
            media/videos/**/720p30/*.mp4
          if-no-files-found: warn
