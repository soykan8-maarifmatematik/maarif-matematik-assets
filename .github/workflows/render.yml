name: Maarif Matematik Video Render

on:
  push:
    paths:
      - 'scripts/render_code.py'
      - 'audio/ders_sesi.mp3'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev \
          mesa-utils libpng-dev libjpeg-dev \
          texlive texlive-latex-extra texlive-fonts-extra \
          texlive-latex-recommended texlive-science texlive-fonts-recommended \
          tipa dvisvgm

      - name: Install Manim and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim numpy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Create Required Directories
        run: |
          mkdir -p media/videos
          mkdir -p scripts
          mkdir -p audio

      - name: Render Manim Video
        run: |
          manim -qm --progress_bar display scripts/render_code.py -a

      - name: Upload Video Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maarif-matematik-video
          path: media/videos/**/*.mp4
          if-no-files-found: warn

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          # Eğer scripts klasöründe upload_to_youtube.py dosyanız varsa onu tetikleriz
          # Not: Bu adım için GitHub Secrets kısmına YouTube API anahtarlarını eklemiş olmanız gerekir.
          python scripts/upload_to_youtube.py
