name: Maarif Matematik Video Render ve Youtube

on:
  push:
    paths:
      - 'metadata.json' # Sadece bu dosya değişince render başlar, çift video sorunu biter.
  workflow_dispatch: # Manuel çalıştırma hakkını saklı tutarız.

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev \
          mesa-utils libpng-dev libjpeg-dev \
          texlive texlive-latex-extra texlive-fonts-extra \
          texlive-latex-recommended texlive-science texlive-fonts-recommended \
          tipa dvisvgm

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim numpy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Create Required Directories
        run: |
          mkdir -p media/videos scripts audio

      - name: Render Manim Video
        run: |
          manim -qm --progress_bar display scripts/render_code.py -a

      - name: Merge Audio and Video (SES FIX)
        run: |
          # Manim'in ürettiği sessiz videoyu bul
          VIDEO_PATH=$(find media/videos -name "*.mp4" | head -n 1)
          AUDIO_PATH="audio/ders_sesi.mp3"
          
          if [ -f "$VIDEO_PATH" ] && [ -f "$AUDIO_PATH" ]; then
            echo "Maarif Matematik: Ses ve görüntü birleştiriliyor..."
            # -shortest parametresini kaldırdım ki ses kesilmesin, video ses bitene kadar devam etsin
            ffmpeg -i "$VIDEO_PATH" -i "$AUDIO_PATH" -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 media/videos/final_video.mp4
            mv media/videos/final_video.mp4 "$VIDEO_PATH"
          else
            echo "HATA: Video veya Ses dosyası bulunamadı!"
            exit 1
          fi

      - name: Upload to YouTube
        if: success()
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python scripts/upload_to_youtube.py
