name: Maarif Matematik — YouTube Yükleme

# metadata.json degistiginde veya manuel tetikleme
on:
  push:
    paths:
      - 'metadata.json'
      - 'current_video.mp4'
  workflow_dispatch:

concurrency:
  group: maarif-yukle
  cancel-in-progress: true

jobs:
  yukle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklar
        run: |
          pip install \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: YouTube'a Yukle
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python scripts/upload_to_youtube.py
