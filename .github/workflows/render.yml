name: Maarif Matematik Video Render ve Youtube
on:
  push:
    paths:
      - 'metadata.json' # Sadece bu dosya değiştiğinde fırın çalışır
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (HIZLI MOD)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev \
            texlive-latex-base texlive-latex-recommended dvisvgm ghostscript

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim numpy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Render ve Merge (KUSURSUZ SENKRON)
        run: |
          mkdir -p media/videos
          # Sırasıyla olası sahne isimlerini dener
          manim -qm --media_dir ./media scripts/render_code.py BirimKesirFix || \
          manim -qm --media_dir ./media scripts/render_code.py MaarifScene || \
          manim -qm --media_dir ./media scripts/render_code.py BirimKesirMihlanmis
          
          VIDEO_PATH=$(find media -name "*.mp4" | grep -v "final_output" | head -n 1)
          AUDIO_PATH=$(find . -name "*.mp3" | head -n 1)
          
          if [ -n "$VIDEO_PATH" ] && [ -n "$AUDIO_PATH" ]; then
            ffmpeg -i "$VIDEO_PATH" -i "$AUDIO_PATH" -fflags +genpts -shortest \
            -c:v libx264 -c:a aac -map 0:v:0 -map 1:a:0 -y media/videos/final_output.mp4
          fi

      - name: Upload to YouTube
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python scripts/upload_to_youtube.py
