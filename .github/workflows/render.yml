name: Maarif Video Render

on:
  push:
    paths:
      - 'metadata.json'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev
          pip install manim google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create Directories
        run: mkdir -p media/videos output

      - name: Render Manim Video
        run: |
          # Sınıf ismini otomatik bul ya da MaarifScene olduğunu varsay
          manim -ql scripts/render_code.py MaarifScene --media_dir ./media
        continue-on-error: false

      - name: Merge Audio and Video (SENKRONİZE)
        run: |
          VIDEO_PATH=$(find media -name "*.mp4" | head -n 1)
          AUDIO_PATH="audio.mp3"
          
          if [ -z "$VIDEO_PATH" ]; then
            echo "❌ HATA: Video dosyası render edilemedi!"
            exit 1
          fi
          
          if [ ! -f "$AUDIO_PATH" ]; then
            echo "⚠️ UYARI: Ses dosyası yok, sadece video taşınıyor."
            cp "$VIDEO_PATH" media/videos/final_output.mp4
          else
            ffmpeg -i "$VIDEO_PATH" -i "$AUDIO_PATH" -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 media/videos/final_output.mp4 -y
          fi

      - name: Upload to YouTube
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python scripts/upload_to_youtube.py
