name: Maarif Matematik Video Render

on:
  push:
    paths:
      - 'metadata.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev \
          texlive-latex-base texlive-latex-recommended texlive-fonts-recommended dvisvgm

      - name: Install Python Libraries
        run: pip install manim numpy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Create Directories
        run: mkdir -p media/videos audio

      - name: Render Manim Video
        run: |
          # '-a' parametresi ile dosyadaki TÜM sahneleri otomatik render eder
          manim -qm --media_dir ./media scripts/render_code.py -a

      - name: Merge Audio and Video
        run: |
          # En son üretilen video ve ses dosyasını bul
          VIDEO_PATH=$(find media -name "*.mp4" | head -n 1)
          AUDIO_PATH=$(find . -name "*.mp3" | head -n 1)
          
          if [ -n "$VIDEO_PATH" ] && [ -n "$AUDIO_PATH" ]; then
            ffmpeg -i "$VIDEO_PATH" -i "$AUDIO_PATH" -c:v libx264 -c:a aac -map 0:v:0 -map 1:a:0 -y media/videos/final_output.mp4
          else
            echo "❌ HATA: Video veya Ses dosyası bulunamadı!"
            exit 1
          fi

      - name: Upload to YouTube
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python scripts/upload_to_youtube.py
