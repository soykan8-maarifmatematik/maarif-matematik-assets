name: Maarif Matematik Video Render

on:
  push:
    paths:
      - 'scripts/render_code.py'
      - 'audio/ders_sesi.mp3'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev mesa-utils libpng-dev libjpeg-dev

      - name: Install Manim and Dependencies
        run: |
          python -m pip install --upgrade pip
          # Requirements dosyası olsa da olmasa da manim'i direkt kuruyoruz
          python -m pip install manim numpy

      - name: Render Manim Video
        run: |
          # Manim sahnelerini render etmek için en güvenli yol budur.
          # -qm: Orta kalite (720p), -ql: Düşük kalite (480p) hızlı test için kullanılabilir.
          # --all: Dosya içindeki tüm sahneleri render eder.
          manim -qm scripts/render_code.py --all

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maarif-matematik-video
          # Manim çıktıları genellikle media/videos/ klasörüne gider
          path: media/videos/render_code/720p30/*.mp4
          if-no-files-found: warn
