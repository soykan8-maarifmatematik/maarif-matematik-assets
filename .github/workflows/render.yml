name: Maarif Matematik Video Render ve Youtube

on:
  push:
    paths:
      - 'metadata.json'
      - 'scripts/render_code.py'
      - 'audio/ders_sesi.mp3'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev \
          mesa-utils libpng-dev libjpeg-dev \
          texlive texlive-latex-extra texlive-fonts-extra \
          texlive-latex-recommended texlive-science texlive-fonts-recommended \
          tipa dvisvgm

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim numpy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Create Required Directories
        run: |
          mkdir -p media/videos scripts audio

      - name: Render Manim Video
        run: |
          # Render komutunu ve çıktı dizinini sabitledik
          manim -qm --media_dir ./media scripts/render_code.py -a

      - name: Merge Audio and Video (GÜÇLENDİRİLMİŞ YOL)
        run: |
          # Derindeki tüm mp4 dosyalarını tara ve en güncelini al
          VIDEO_PATH=$(find media -name "*.mp4" | head -n 1)
          AUDIO_PATH="audio/ders_sesi.mp3"
          
          echo "Aranan Video Yolu: $VIDEO_PATH"
          echo "Aranan Ses Yolu: $AUDIO_PATH"
          
          if [ -n "$VIDEO_PATH" ] && [ -f "$AUDIO_PATH" ]; then
            echo "Maarif Matematik: Dosyalar bulundu, birleştiriliyor..."
            ffmpeg -i "$VIDEO_PATH" -i "$AUDIO_PATH" -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 final_video_output.mp4
            # upload_to_youtube.py dosyasının beklediği yere taşı
            mkdir -p media/videos
            mv final_video_output.mp4 media/videos/final_output.mp4
          else
            echo "HATA: Video ($VIDEO_PATH) veya Ses ($AUDIO_PATH) bulunamadı!"
            exit 1
          fi

      - name: Upload to YouTube
        if: success()
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python scripts/upload_to_youtube.py
