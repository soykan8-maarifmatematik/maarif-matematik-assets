name: Maarif Matematik Video Render ve Youtube
concurrency:
  group: maarif-render
  cancel-in-progress: true

on:
  push:
    paths:
      - 'metadata.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev freeglut3-dev \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra dvisvgm ghostscript

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim numpy google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Render ve Merge (TAM GÖRSEL SENKRON)
        run: |
          mkdir -p media/videos
          
          manim -qm --media_dir ./media scripts/render_code.py MaarifScene || \
          manim -qm --media_dir ./media scripts/render_code.py
          
          VIDEO_PATH=$(find media -name "*.mp4" | grep -v "final_output" | head -n 1)
          AUDIO_PATH=$(find . -name "*.mp3" | head -n 1)
          
          if [ -n "$VIDEO_PATH" ] && [ -n "$AUDIO_PATH" ]; then
            # -shortest kaldırıldı! Görüntü ne kadar sürerse video o kadar sürecek.
            # Artık tüm odağımız Manim kodundaki süreyi sese uydurmak.
            ffmpeg -i "$VIDEO_PATH" -i "$AUDIO_PATH" -fflags +genpts \
            -c:v libx264 -c:a aac -map 0:v:0 -map 1:a:0 -y media/videos/final_output.mp4
          fi

      - name: Upload to Social Media
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/upload_social.py
